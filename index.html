<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="estilos/styles.css">
    <link rel="stylesheet" href="estilos/media-query.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
</head>
<body>
    <main>
        <section id="login" >
            <div id="imagem">

                <!--Imagem em CSS-->

            </div>

            <div id="formulario">
                <h1>Login</h1>
                <p>Seja bem vindo(a) novamente! Faça o login para acessar a sua conta e poder fazer as configurações no seu ambiente</p>

                <form action="login.php" method="post">
                    <div class="campo">
                        <span class="material-symbols-outlined">person</span>
                        <input type="email" name="login" id="ilogin" placeholder="seu e-mail" required autocomplete="on" maxlength="30">
                        <label for="ilogin">Login</label>
                    </div>

                    <div>
                        <span class="material-symbols-outlined">vpn_key</span>
                        <input type="password" name="senha" id="isenha" placeholder="seua senha" required autocomplete="current-password">
                        <label for="isenha">Senha</label>
                    </div>

                    <div>
                        <input id="entrar" type="submit" value="Entrar">
                        <a id="esqueci" href="esqueci.html">Esqueci a senha <span class="material-symbols-outlined">mail</span></a>
                    </div>

                </form>

            </div>
            
        </section>
         
    </main>
</body>
</html>
